                                <div>
                                    <h5 className="font-bold mb-3 md:mb-4 text-earth-cream/80 text-xs md:text-sm uppercase tracking-widest">شبکه‌های اجتماعی</h5>
                                    <div className="flex gap-3 md:gap-4">
                                         <SocialLink href="https://linkedin.com/in/mehran-mesbahzadeh" icon={Linkedin} label="LinkedIn" />
                                         <SocialLink href="https://github.com/mesbahzadeh" icon={Github} label="GitHub" />
                                         <SocialLink href="https://instagram.com/mehran.mesbahzadeh" icon={Instagram} label="Instagram" />
                                         <SocialLink href="https://twitter.com/mehran_mesbah" icon={Twitter} label="Twitter" />
                                    </div>
                                </div>
                            </div>

                            <div className="bg-earth-cream/5 backdrop-blur-md border border-earth-cream/10 p-6 md:p-10 rounded-2xl md:rounded-3xl shadow-xl md:shadow-2xl">
                                <form onSubmit={handleSubmit} className="space-y-5 md:space-y-6">
                                    <div className="grid md:grid-cols-2 gap-4 md:gap-6">
                                        <InputGroup 
                                            label="نام و نام خانوادگی" 
                                            type="text" 
                                            name="name"
                                            value={formData.name}
                                            onChange={handleChange}
                                            required
                                        />
                                        <InputGroup 
                                            label="آدرس ایمیل" 
                                            type="email" 
                                            dir="ltr"
                                            name="email"
                                            value={formData.email}
                                            onChange={handleChange}
                                            required
                                        />
                                    </div>
                                    <InputGroup 
                                        label="موضوع پیام" 
                                        type="text" 
                                        name="subject"
                                        value={formData.subject}
                                        onChange={handleChange}
                                        required
                                    />
                                    <div className="space-y-2">
                                        <label className="text-xs md:text-sm font-bold text-earth-cream/80 block">متن پیام</label>
                                        <textarea 
                                            name="message"
                                            rows="4" 
                                            className="w-full px-4 py-3 rounded-xl bg-white/5 border border-earth-cream/10 focus:border-earth-sand focus:bg-white/10 outline-none transition-all text-earth-cream resize-none text-sm md:text-base"
                                            value={formData.message}
                                            onChange={handleChange}
                                            required
                                        ></textarea>
                                    </div>
                                    <button 
                                        type="submit" 
                                        className="w-full py-3 md:py-4 bg-earth-sand text-earth-dark font-extrabold rounded-xl hover:bg-earth-primary hover:text-white transition-all flex items-center justify-center gap-2 shadow-lg active:scale-95 min-h-[50px]"
                                        aria-label="ارسال پیام"
                                    >
                                        ارسال پیام <Send size={18} md={20} />
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const Footer = () => (
            <footer className="bg-earth-dark py-6 md:py-8 border-t border-earth-cream/5 text-center text-earth-cream/40 text-xs md:text-sm">
                <div className="container mx-auto px-4 sm:px-6">
                    <p>© ۲۰۲۶ تمامی حقوق برای مهران مصباح‌زاده محفوظ است. | طراحی شده با ❤️ و React</p>
                </div>
            </footer>
        );

        // --- Helper Components ---
        
        const SocialLink = ({ href, icon: Icon, label }) => (
            <a 
                href={href} 
                target="_blank" 
                rel="noopener noreferrer" 
                className="w-10 h-10 md:w-12 md:h-12 flex items-center justify-center rounded-full bg-white/5 border border-white/10 text-earth-cream hover:bg-earth-sand hover:text-earth-dark hover:scale-110 transition-all duration-300 active:scale-95"
                aria-label={label}
            >
                <Icon size={18} md={20} />
            </a>
        );

        const ContactItem = ({ icon: Icon, title, value, href }) => (
            <div className="flex items-center gap-3 md:gap-4 group">
                <div className="w-10 h-10 md:w-12 md:h-12 bg-earth-primary/20 rounded-lg md:rounded-xl flex items-center justify-center text-earth-sand group-hover:bg-earth-sand group-hover:text-earth-dark transition-colors">
                    <Icon size={20} md={22} />
                </div>
                <div>
                    <h4 className="font-bold text-earth-cream text-base md:text-lg">{title}</h4>
                    <a 
                        href={href} 
                        className="text-earth-cream/60 group-hover:text-earth-sand transition-colors font-sans dir-ltr block text-left text-sm md:text-base break-all"
                        aria-label={`${title}: ${value}`}
                    >
                        {value}
                    </a>
                </div>
            </div>
        );

        const InputGroup = ({ label, type, dir, name, value, onChange, required }) => (
            <div className="space-y-2">
                <label className="text-xs md:text-sm font-bold text-earth-cream/80 block">{label}</label>
                <input 
                    type={type} 
                    dir={dir}
                    name={name}
                    value={value}
                    onChange={onChange}
                    className="w-full px-4 py-3 rounded-xl bg-white/5 border border-earth-cream/10 focus:border-earth-sand focus:bg-white/10 outline-none transition-all text-earth-cream text-sm md:text-base"
                    required={required}
                    aria-label={label}
                />
            </div>
        );

        const App = () => {
            useEffect(() => {
                // Add meta tags for SEO and mobile
                const viewportMeta = document.querySelector('meta[name="viewport"]');
                if (viewportMeta) {
                    viewportMeta.content = "width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes";
                }
                
                // Prevent zoom on double-tap
                document.addEventListener('touchstart', function(event) {
                    if (event.touches.length > 1) {
                        event.preventDefault();
                    }
                }, { passive: false });
                
                let lastTouchEnd = 0;
                document.addEventListener('touchend', function(event) {
                    const now = (new Date()).getTime();
                    if (now - lastTouchEnd <= 300) {
                        event.preventDefault();
                    }
                    lastTouchEnd = now;
                }, false);
                
                // Load font with font-display: swap
                const fontLink = document.createElement('link');
                fontLink.rel = 'stylesheet';
                fontLink.href = 'https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap';
                document.head.appendChild(fontLink);
                
                // Set lang and dir attributes
                document.documentElement.lang = 'fa';
                document.documentElement.dir = 'rtl';
                
                // Add structured data for SEO
                const structuredData = {
                    "@context": "https://schema.org",
                    "@type": "Person",
                    "name": "مهران مصباح‌زاده",
                    "jobTitle": "مهندس هوش مصنوعی و مدرس",
                    "url": window.location.href,
                    "sameAs": [
                        "https://github.com/mesbahzadeh",
                        "https://linkedin.com/in/mehran-mesbahzadeh",
                        "https://mesbahzadeh.pythonanywhere.com"
                    ],
                    "knowsAbout": ["هوش مصنوعی", "یادگیری ماشین", "پایتون", "علم داده", "توسعه وب"],
                    "description": "متخصص هوش مصنوعی، یادگیری ماشین، پایتون و علم داده با بیش از ۸ سال تجربه"
                };
                
                const script = document.createElement('script');
                script.type = 'application/ld+json';
                script.text = JSON.stringify(structuredData);
                document.head.appendChild(script);
                
                return () => {
                    document.removeEventListener('touchstart', () => {});
                    document.removeEventListener('touchend', () => {});
                };
            }, []);

            return (
                <div className="font-sans antialiased">
                    <Navbar />
                    <main>
                        <Hero />
                        <About />
                        <Skills />
                        <Courses />
                        <Portfolio />
                        <Contact />
                    </main>
                    <Footer />
                </div>
            );
        };

        // --- Mounting with Error Handling ---
        const mountApp = () => {
            try {
                const rootElement = document.getElementById('root');
                if (rootElement) {
                    const root = createRoot(rootElement);
                    root.render(<App />);
                } else {
                    console.error('Root element not found');
                }
            } catch (error) {
                console.error('Failed to mount React app:', error);
                document.getElementById('root').innerHTML = `
                    <div style="padding: 2rem; text-align: center; background: #FEFAE0; color: #283618; min-height: 100vh; display: flex; align-items: center; justify-content: center;">
                        <div>
                            <h1 style="font-size: 1.5rem; font-weight: bold; margin-bottom: 1rem; color: #BC6C25;">خطا در بارگذاری</h1>
                            <p>مشکلی در بارگذاری صفحه پیش آمده است. لطفاً صفحه را رفرش کنید.</p>
                        </div>
                    </div>
                `;
            }
        };

        // Wait for DOM to be ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', mountApp);
        } else {
            mountApp();
        }
    </script>
</body>
</html>
